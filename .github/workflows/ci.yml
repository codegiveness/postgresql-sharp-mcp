name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and real MCP integration
        run: bash scripts/verify.sh
      - name: Pack .NET tool
        run: dotnet pack src/PostgreSqlMcp/PostgreSqlMcp.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-tool
          path: artifacts/*.nupkg
