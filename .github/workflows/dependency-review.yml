name: Dependency review
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        # Vulnerability gate only. GitHub's dependency graph carries no license data for this repository's NuGet
        # and npm dependencies, so a license allowlist would be unenforceable; licenses are tracked by hand in
        # THIRD-PARTY-NOTICES.md. Newly introduced dependencies with high or critical advisories fail the check.
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never
