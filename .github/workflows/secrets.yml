name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Includes every branch/tag and the PR merge commit with both parents.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Build the repository verifier
        run: dotnet build tools/PostgreSqlMcp.Verify -c Release -p:RestoreLockedMode=true --nologo
      - name: Install checksum-verified Gitleaks CLI
        # Version, URL and SHA-256 are pinned in tools/PostgreSqlMcp.Verify/PinnedTools.cs (official
        # v8.30.1 release and gitleaks_8.30.1_checksums.txt); a mismatch fails closed.
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-ignore"
          dotnet run --project tools/PostgreSqlMcp.Verify -c Release --no-build -- install-tool gitleaks --output "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Prove the custom detector rules still fire
        # Synthetic fixtures in a temporary directory; asserts each .gitleaks.toml rule id and the exact placeholder allowlist.
        run: dotnet run --project tools/PostgreSqlMcp.Verify -c Release --no-build -- secret-detectors
      - name: Scan all reachable history including pull-request commits
        # Never baseline historical findings, honor inline suppression comments,
        # or publish findings as artifacts. Nonverbose redacted logs give counts
        # without source snippets, commit messages, or credential-bearing reports.
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git .
          --config .gitleaks.toml
          --log-opts="--all --full-history"
          --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore"
          --ignore-gitleaks-allow
          --redact=100 --exit-code=1 --no-banner --no-color --log-level=warn
