name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Includes every branch/tag and the PR merge commit with both parents.
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks CLI
        # Official v8.30.1 release and gitleaks_8.30.1_checksums.txt:
        # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-ignore"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan all reachable history including pull-request commits
        # Never baseline historical findings, honor inline suppression comments,
        # or publish findings as artifacts. Nonverbose redacted logs give counts
        # without source snippets, commit messages, or credential-bearing reports.
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git .
          --config .gitleaks.toml
          --log-opts="--all --full-history"
          --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore"
          --ignore-gitleaks-allow
          --redact=100 --exit-code=1 --no-banner --no-color --log-level=warn
