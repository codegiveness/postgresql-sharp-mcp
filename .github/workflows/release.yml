name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<version> release tag
        required: true
        type: string
      target:
        description: Publication target
        required: true
        type: choice
        default: all
        options: [all, github, npm, nuget]
permissions: {}
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RestoreLockedMode: 'true'
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tool_artifact_id: ${{ steps.tool.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Resolve an existing release tag on main
        id: tag
        run: dotnet run --project tools/PostgreSqlMcp.Release -c Release -- validate-tag
      - name: Build trusted main publication tooling
        run: dotnet publish tools/PostgreSqlMcp.Release -c Release -p:RestoreLockedMode=true -o "$RUNNER_TEMP/release-tool"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: tool
        with:
          name: release-tool
          path: ${{ runner.temp }}/release-tool
          if-no-files-found: error
  package:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RestoreLockedMode: 'true'
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      npm_name: ${{ steps.metadata.outputs.npm_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download trusted main publication tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.tool_artifact_id }}
          path: release-tool
          digest-mismatch: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: dotnet restore postgresql-sharp-mcp.slnx --locked-mode
      - name: Verify tag and package metadata
        id: metadata
        run: dotnet release-tool/PostgreSqlMcp.Release.dll metadata
      - name: Verify real PostgreSQL MCP behavior
        run: dotnet run --project tools/PostgreSqlMcp.Verify -c Release -- integration
      - name: Build .NET distributions
        run: dotnet run --project tools/PostgreSqlMcp.Build -c Release -- package --output artifacts/packages
      - name: Verify installed distributions
        run: dotnet run --project tools/PostgreSqlMcp.Verify -c Release -- packages --artifacts artifacts/packages
      - name: Build self-contained archives
        run: dotnet release-tool/PostgreSqlMcp.Release.dll archives
      - name: Generate application SBOM and checksums
        run: dotnet release-tool/PostgreSqlMcp.Release.dll sbom
      - name: Generate internal publication context
        run: dotnet release-tool/PostgreSqlMcp.Release.dll context
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            artifacts/archives/*
            artifacts/packages/*.nupkg
            artifacts/packages/*.tgz
            artifacts/sbom/bom.json
            artifacts/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-context
          path: artifacts/publication-context.json
          if-no-files-found: error
  attest:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - name: Attest archives, package files, SBOM and checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/archives/*
            artifacts/packages/*.tgz
            artifacts/packages/*.nupkg
            artifacts/sbom/bom.json
            artifacts/SHA256SUMS
      - name: Keep the provenance bundle for the GitHub Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
  github-release:
    needs: [preflight, package, attest]
    if: inputs.target == 'all' || inputs.target == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      RestoreLockedMode: 'true'
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download trusted main publication tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.tool_artifact_id }}
          path: release-tool
          digest-mismatch: error
      - name: Download metadata, release artifacts and provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-context --dir publication-context
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-provenance --dir provenance
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet release-tool/PostgreSqlMcp.Release.dll github --context publication-context/publication-context.json
  npm:
    needs: [preflight, package, attest, github-release]
    if: >-
      ${{ !cancelled() && (inputs.target == 'all' || inputs.target == 'npm') &&
          needs.preflight.result == 'success' &&
          needs.package.result == 'success' && needs.attest.result == 'success' &&
          (needs.github-release.result == 'success' ||
           (inputs.target == 'npm' && needs.github-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RestoreLockedMode: 'true'
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
      - name: Install reviewed npm CLI with staged-publishing support
        # Exact registry tarball for npm 12.2.0; NPM_SHA512 is the hex form of its
        # published dist.integrity. No npm install or lifecycle scripts run.
        env:
          NPM_SHA512: 66c2632a94e796649738b2d7894d710c2cc2e1696893823066687f6b0d8a52e5f2b54eeaeaa32ffdc513ecca1e49ff794a5c2ec3f9515d879f1b3182b291cf35
        run: |
          mkdir -p "$RUNNER_TEMP/npm-cli" "$RUNNER_TEMP/npm-bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://registry.npmjs.org/npm/-/npm-12.2.0.tgz --output "$RUNNER_TEMP/npm.tgz"
          printf '%s  %s\n' "$NPM_SHA512" "$RUNNER_TEMP/npm.tgz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/npm-cli" --strip-components=1
          ln -s "$RUNNER_TEMP/npm-cli/bin/npm-cli.js" "$RUNNER_TEMP/npm-bin/npm"
          echo "$RUNNER_TEMP/npm-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-bin/npm" --version
      - name: Download trusted main publication tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.tool_artifact_id }}
          path: release-tool
          digest-mismatch: error
      - name: Download metadata and release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-context --dir publication-context
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - name: Stage npm tarball with OIDC pending Windows 2FA approval
        run: dotnet release-tool/PostgreSqlMcp.Release.dll npm --context publication-context/publication-context.json
  nuget:
    needs: [preflight, package, attest, github-release]
    if: >-
      ${{ !cancelled() && (inputs.target == 'all' || inputs.target == 'nuget') &&
          needs.preflight.result == 'success' &&
          needs.package.result == 'success' && needs.attest.result == 'success' &&
          (needs.github-release.result == 'success' ||
           (inputs.target == 'nuget' && needs.github-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RestoreLockedMode: 'true'
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download trusted main publication tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.tool_artifact_id }}
          path: release-tool
          digest-mismatch: error
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - name: Require NuGet publishing account
        env:
          NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
        run: dotnet release-tool/PostgreSqlMcp.Release.dll require-secret NUGET_USERNAME
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Publish NuGet with short-lived OIDC credential
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/codegiveness.postgresql-sharp-mcp.${{ needs.package.outputs.version }}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
