name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<version> release tag
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RestoreLockedMode: 'true'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      npm_name: ${{ steps.metadata.outputs.npm_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: dotnet restore postgresql-sharp-mcp.slnx --locked-mode
      - name: Verify tag and package metadata
        id: metadata
        run: dotnet run --project tools/PostgreSqlMcp.Release -c Release -- metadata
      - name: Verify real PostgreSQL MCP behavior
        run: dotnet run --project tools/PostgreSqlMcp.Verify -c Release -- integration
      - name: Build .NET distributions
        run: dotnet run --project tools/PostgreSqlMcp.Build -c Release -- package --output artifacts/packages
      - name: Verify installed distributions
        run: dotnet run --project tools/PostgreSqlMcp.Verify -c Release -- packages --artifacts artifacts/packages
      - name: Build self-contained archives
        run: dotnet run --project tools/PostgreSqlMcp.Release -c Release -- archives
      - name: Generate application SBOM and checksums
        run: dotnet run --project tools/PostgreSqlMcp.Release -c Release -- sbom
      - name: Attest archives, package files, SBOM and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/archives/*
            artifacts/packages/*.tgz
            artifacts/packages/*.nupkg
            artifacts/sbom/bom.json
            artifacts/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            artifacts/archives/*
            artifacts/packages/*.nupkg
            artifacts/packages/*.tgz
            artifacts/sbom/bom.json
            artifacts/SHA256SUMS
          if-no-files-found: error
  github-release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RestoreLockedMode: 'true'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.package.outputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - run: dotnet run --project tools/PostgreSqlMcp.Release -c Release -- github
  npm:
    needs: [package, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RestoreLockedMode: 'true'
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.package.outputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - name: Publish with npm provenance
        run: dotnet run --project tools/PostgreSqlMcp.Release -c Release -- npm
  nuget:
    needs: [package, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RestoreLockedMode: 'true'
      GH_TOKEN: ${{ github.token }}
      NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.package.outputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tools/PostgreSqlMcp.Release -c Release -- require-secret NUGET_USERNAME
      - run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Publish NuGet with short-lived OIDC credential
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/codegiveness.postgresql-sharp-mcp.${{ needs.package.outputs.version }}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
