name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching both package versions (for example v0.1.0)'
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      npm_name: ${{ steps.metadata.outputs.npm_name }}
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::A release requires an existing v<package-version> tag."
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.release.outputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Require tag to match both package versions
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(dotnet msbuild src/PostgreSqlMcp/PostgreSqlMcp.csproj -getProperty:Version)"
          npm_version="$(node -p "require('./npm/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" || "$npm_version" != "$version" ]]; then
            echo "::error::The tag, NuGet version and npm version must match."
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'npm_name=%s\n' "$(node -p "require('./npm/package.json').name")" >> "$GITHUB_OUTPUT"
      - name: Verify real MCP behavior
        run: bash scripts/verify.sh
      - name: Build local NuGet and npm packages
        run: python3 scripts/package.py --output artifacts/packages
      - name: Exercise installed package entrypoints
        run: python3 scripts/package-smoke.py --artifacts artifacts/packages
      - name: Build self-contained release archives
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p artifacts/archives
          for rid in linux-x64 linux-arm64 win-x64 osx-x64 osx-arm64; do
            publish_dir="$RUNNER_TEMP/postgresql-sharp-mcp-$rid"
            dotnet publish src/PostgreSqlMcp/PostgreSqlMcp.csproj -c Release -r "$rid" --self-contained -p:Version="$RELEASE_VERSION" -o "$publish_dir"
            tar -czf "artifacts/archives/postgresql-sharp-mcp-$rid.tar.gz" -C "$publish_dir" .
          done
      - name: Upload completed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            artifacts/archives/*.tar.gz
            artifacts/packages/*.nupkg
            artifacts/packages/*.tgz
          if-no-files-found: error

  github-release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          shopt -s nullglob
          archives=(artifacts/archives/*.tar.gz)
          nuget=(artifacts/packages/*.nupkg)
          npm=(artifacts/packages/*.tgz)
          if [[ "${#archives[@]}" != 5 || "${#nuget[@]}" != 1 || "${#npm[@]}" != 1 ]]; then
            echo "::error::The verified release artifact set is incomplete."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${archives[@]}" "${nuget[@]}" "${npm[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          printf 'GitHub Release: %s\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  npm:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require npm environment credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Publication requires NPM_TOKEN in the release environment."
            echo 'npm publication not performed: NPM_TOKEN is missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - name: Publish npm package unless version already exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/release.npmrc
          PACKAGE_NAME: ${{ needs.package.outputs.npm_name }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          umask 077
          printf '%s\n' "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const registry = 'https://registry.npmjs.org/';
          const version = process.env.PACKAGE_VERSION;
          const lookup = spawnSync('npm', ['view', `${process.env.PACKAGE_NAME}@${version}`,
            'version', '--json', '--registry', registry], { encoding: 'utf8' });
          let result;
          try { result = JSON.parse(lookup.stdout); } catch {}
          if (lookup.status === 0 && result === version) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `npm ${version} already exists; immutable package was not republished.\n`);
            process.exit(0);
          }
          if (lookup.status === 0 || result?.error?.code !== 'E404') {
            throw new Error('npm version lookup failed; check registry availability and token permissions.');
          }
          const files = fs.readdirSync('artifacts/packages').filter(file => file.endsWith('.tgz'));
          if (files.length !== 1) throw new Error('Expected exactly one verified npm package.');
          const published = spawnSync('npm', ['publish', `artifacts/packages/${files[0]}`,
            '--ignore-scripts', '--access', 'public', '--registry', registry,
            '--tag', version.includes('-') ? 'next' : 'latest'], { stdio: 'inherit' });
          if (published.error || published.status !== 0) throw new Error('npm publication failed.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Published npm ${version}.\n`);
          NODE

  nuget:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require NuGet publishing identity
        env:
          NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
        run: |
          if [[ -z "$NUGET_USERNAME" ]]; then
            echo "::error::Publication requires NUGET_USERNAME and a matching nuget.org trusted publishing policy."
            echo 'NuGet publication not performed: publishing identity is missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir artifacts
      - name: Authenticate to NuGet using GitHub OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Publish NuGet package, tolerating existing immutable versions
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [[ "${#packages[@]}" != 1 ]]; then
            echo "::error::Expected exactly one verified NuGet package."
            exit 1
          fi
          dotnet nuget push "${packages[0]}" --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
          echo 'NuGet push completed; existing immutable versions are skipped with a warning in the push log.' >> "$GITHUB_STEP_SUMMARY"
