name: Container security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Build the repository verifier
        run: dotnet build tools/PostgreSqlMcp.Verify -c Release -p:RestoreLockedMode=true --nologo
      - name: Install checksum-verified Trivy
        # Version, URL and SHA-256 are pinned in tools/PostgreSqlMcp.Verify/PinnedTools.cs (official v0.76.1
        # release and trivy_0.76.1_checksums.txt); no install script, and a mismatch fails closed.
        run: |
          dotnet run --project tools/PostgreSqlMcp.Verify -c Release --no-build -- install-tool trivy --output "$RUNNER_TEMP/trivy-bin"
          "$RUNNER_TEMP/trivy-bin/trivy" --version
      - name: Build the actual application image
        run: docker build --pull --tag postgresql-sharp-mcp:security .
      - name: Gate OS and application vulnerabilities
        # Include unfixed findings. Disable implicit repo-local config/ignore files;
        # any future exception must be justified, scoped and expiry-bound in review.
        run: |
          mkdir -p artifacts/container-security
          "$RUNNER_TEMP/trivy-bin/trivy" image \
            --config '' --ignorefile '' \
            --image-src docker --scanners vuln --pkg-types os,library \
            --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --timeout 10m --no-progress --disable-telemetry --skip-version-check \
            --format json --list-all-pkgs=false \
            --output artifacts/container-security/trivy.json \
            postgresql-sharp-mcp:security
      - name: Preserve vulnerability report, including failed gates
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/container-security/trivy.json
          if-no-files-found: error
          retention-days: 7
