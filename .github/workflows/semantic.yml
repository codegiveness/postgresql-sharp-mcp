name: Semantic PR title
# Trigger choice: plain `pull_request`, not `pull_request_target`. The action only reads the title from the event payload, so it needs no
# privileged token; `pull_request_target` would add a write-capable path for fork PRs and gain nothing. This job checks out and executes nothing.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Types and summary style are the ones in docs/git-workflow.md (Commits): the squash commit on main is the PR title.
          types: |
            feat
            fix
            docs
            ci
            build
            perf
            refactor
            test
            chore
          subjectPattern: ^[^A-Z].*[^.]$
          subjectPatternError: The summary "{subject}" must start with a lowercase letter and must not end with a period (docs/git-workflow.md, Commits).
