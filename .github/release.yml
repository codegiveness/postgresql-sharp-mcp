# Categories for GitHub's generated release notes (gh release create --generate-notes
# in tools/PostgreSqlMcp.Release). Not a workflow; the release workflow is
# .github/workflows/release.yml.
changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
